name: Lint & Test
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  elmo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go run ./internal/lint/cmd/elmo ./...
  test:
    uses: SiaFoundation/workflows/.github/workflows/go-test.yml@3d496e2845d325cc657cedfa8ec7aba60953a1c3 # master
    with:
      try-build: false
